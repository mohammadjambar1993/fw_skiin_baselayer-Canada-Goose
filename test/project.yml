---

# Notes:
# Sample project C code is not presently written to produce a release artifact.
# As such, release build options are disabled.
# This sample, therefore, only demonstrates running a collection of unit tests.

:project:
  :use_exceptions: FALSE
  :use_test_preprocessor: TRUE
  :use_auxiliary_dependencies: TRUE
  :build_root: build
#  :release_build: TRUE
  :test_file_prefix: test_
  :which_ceedling: gem
  :ceedling_version: 0.31.1
  :default_tasks:
    - test:all

#:test_build:
#  :use_assembly: TRUE

#:release_build:
#  :output: MyApp.out
#  :use_assembly: FALSE

:environment:

:extension:
  :executable: .out

:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
    - ../src/**    
    - ../src/hal/**
    - ../src/util/**    
    - ../sdk/external/freertos/source/include/**
    - ../sdk/external/freertos/config/**
    - ../sdk/components/libraries/util/**
    - ../sdk/modules/nrfx/mdk/**
    - ../sdk/components/toolchain/cmsis/include/**
    - ../sdk/components/softdevice/s112/headers/**
    - ../sdk/external/freertos/portable/ARM/nrf52/**
    - ../sdk/external/freertos/portable/CMSIS/nrf52/**
    - ../sdk/external/segger_rtt/**
    - ../config/**
  :support:
    - test/support
  :libraries: []

:defines:
  # in order to add common defines:
  #  1) remove the trailing [] from the :common: section
  #  2) add entries to the :common: section (e.g. :test: has TEST defined)
  :common: &common_defines []
  :test:
    - *common_defines
    - TEST    
    - TEST_MOCK_STATIC
    - UNITY_INCLUDE_PRINT_FORMATTED
    - NRF52833_XXAA
    - FREERTOS    
  :test_preprocess:
    - *common_defines    
    - TEST        
    - TEST_MOCK_STATIC
    - INC_FREERTOS_H    
    
:flags:
   :test:
      :compile:
         :*:
            - -Wno-int-to-pointer-cast
            - -Wno-pointer-to-int-cast
            - -Wno-implicit-function-declaration 

:cmock:
  :mock_prefix: mock_
  :when_no_prototypes: :warn
  :enforce_strict_ordering: TRUE
  :plugins:
    - :ignore
    - :callback
  :treat_as:
    uint8:    HEX8
    uint16:   HEX16
    uint32:   UINT32
    int8:     INT8
    bool:     UINT8
#  :includes_h_pre_orig_header:
#    - "FreeRTOS.h"        
#  :includes_c_pre_header:
#    - "FreeRTOS.h"
#    - "FreeRTOSConfig.h"    
#    - "task.h"
#    - ../sdk/external/freertos/source/include/FreeRTOS.h
#    - ../sdk/external/freertos/source/include/task.h
  #:includes:
#    - "FreeRTOS.h"
#    - "FreeRTOSConfig.h"
#    - "task.h"     
#    - ../sdk/external/freertos/source/include/FreeRTOS.h
#    - ../sdk/external/freertos/source/include/task.h
#  :treat_externs: :include

# Add -gcov to the plugins list to make sure of the gcov plugin
# You will need to have gcov and gcovr both installed to make it work.
# For more information on these options, see docs in plugins/gcov
:gcov:
  :reports:
    - HtmlDetailed
  :gcovr:
    :html_medium_threshold: 75
    :html_high_threshold: 90

#:tools:
# Ceedling defaults to using gcc for compiling, linking, etc.
# As [:tools] is blank, gcc will be used (so long as it's in your system path)
# See documentation to configure a given toolchain for use

# LIBRARIES
# These libraries are automatically injected into the build process. Those specified as
# common will be used in all types of builds. Otherwise, libraries can be injected in just
# tests or releases. These options are MERGED with the options in supplemental yaml files.
:libraries:
  :placement: :end
  :flag: "-l${1}"
  :path_flag: "-L ${1}"
  :system: [m]    # for example, you might list 'm' to grab the math library
  :test: []
  :release: []

:plugins:
  :load_paths:
    - "#{Ceedling.load_path}"
  :enabled:
    - stdout_pretty_tests_report
    - module_generator
...
